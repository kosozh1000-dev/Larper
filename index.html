<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#9bdcf5">
<title>Meadowbound — a tiny sky adventure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Fredoka:wght@500;600;700&display=swap');
:root{--ink:#25404b;--cream:#fff9e9;--green:#73b95e;--gold:#ffce55}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:#9bdcf5;color:var(--ink);font-family:'DM Sans',sans-serif;display:grid;place-items:center}.game-shell{position:relative;width:min(100vw,1440px);height:min(100vh,900px);min-height:320px;overflow:hidden;background:#9bdcf5;box-shadow:0 24px 80px #29556a33}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.topbar{position:absolute;inset:22px 26px auto;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:2}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:42px;height:42px;display:grid;place-items:center;background:var(--cream);border-radius:14px;box-shadow:0 4px 0 #d9e8ca;font-size:23px}.brand-name{font:700 19px Fredoka,sans-serif;letter-spacing:.1px}.brand-sub{font-size:10px;font-weight:700;letter-spacing:1.9px;text-transform:uppercase;opacity:.65;margin-top:1px}.stats{display:flex;gap:9px}.pill{display:flex;align-items:center;gap:8px;min-width:92px;padding:10px 15px;border-radius:999px;background:#fff9e9eF;box-shadow:0 4px 0 #d6e7d0aa;font-size:13px;font-weight:800}.pill-icon{font-size:17px}.pill span:last-child{font-variant-numeric:tabular-nums}.progress-wrap{position:absolute;z-index:2;left:50%;top:32px;transform:translateX(-50%);width:min(230px,26vw);pointer-events:none}.progress-label{display:flex;justify-content:space-between;font-size:9px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;opacity:.72;margin-bottom:7px}.progress-track{height:8px;border-radius:8px;background:#fff9e9a6;box-shadow:inset 0 1px 2px #426c6350;overflow:hidden}.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#ffbd45,#f3894e);border-radius:8px;transition:width .15s}.overlay{position:absolute;z-index:4;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#2449571c,#24495746);padding:20px;transition:opacity .25s,visibility .25s}.overlay.hidden{opacity:0;visibility:hidden;pointer-events:none}.card{width:min(440px,92vw);text-align:center;padding:35px 36px 29px;border:3px solid #fffdf2;border-radius:28px;background:#fff9e9;box-shadow:0 13px 0 #527f6352,0 30px 70px #26495442;animation:bob 3s ease-in-out infinite}.eyebrow{display:inline-flex;align-items:center;gap:7px;color:#52785c;background:#e8f2d9;border-radius:30px;padding:7px 12px;font-size:10px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase}.card h1{font:700 clamp(38px,7vw,54px)/.98 Fredoka,sans-serif;margin:18px 0 10px;color:#294752;letter-spacing:-1.6px}.card h1 em{font-style:normal;color:#e79146}.card p{max-width:320px;margin:0 auto;color:#698078;font-size:14px;line-height:1.6}.play-button{margin-top:24px;border:0;border-radius:15px;background:#ed9d48;color:white;padding:14px 28px;font:700 16px Fredoka,sans-serif;box-shadow:0 5px 0 #c67536;cursor:pointer;transition:transform .12s,box-shadow .12s}.play-button:hover{transform:translateY(-2px);box-shadow:0 7px 0 #c67536}.play-button:active{transform:translateY(3px);box-shadow:0 2px 0 #c67536}.controls-hint{margin-top:19px;color:#8b9b8a;font-size:11px;font-weight:700}.controls-hint b{color:#587064}.bottom-hint{position:absolute;z-index:2;bottom:19px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:1.7px;font-weight:800;text-transform:uppercase;color:#315b62a6;pointer-events:none;white-space:nowrap}.sound-button{position:absolute;z-index:3;right:28px;bottom:18px;width:39px;height:39px;border:0;border-radius:13px;background:#fff9e9d9;color:var(--ink);font-size:17px;cursor:pointer;box-shadow:0 3px 0 #7a9e7660}.mobile-controls{display:none;position:absolute;z-index:3;inset:auto 16px 18px;justify-content:space-between;pointer-events:none}.mobile-controls button{pointer-events:auto;border:0;background:#fff9e9bb;color:#355862;border-radius:50%;width:58px;height:58px;font-size:23px;font-weight:800;box-shadow:0 4px 0 #527b6b66;touch-action:none}.mobile-controls .right-group{display:flex;gap:12px}.mobile-controls .jump{background:#ffcf63bb}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@media(max-width:700px){.topbar{inset:12px 12px auto}.brand-mark{width:34px;height:34px;font-size:18px;border-radius:11px}.brand-name{font-size:16px}.brand-sub{font-size:8px;letter-spacing:1.2px}.pill{min-width:65px;padding:8px 10px;font-size:11px;gap:5px}.pill-icon{font-size:14px}.progress-wrap{top:68px;width:140px}.bottom-hint{display:none}.mobile-controls{display:flex}.sound-button{right:13px;bottom:87px;width:34px;height:34px}.card{padding:27px 22px 23px}.card p{font-size:13px}}@media(max-height:460px){.card{padding:20px}.card h1{margin:10px 0;font-size:38px}.card p{font-size:12px}.play-button{margin-top:13px;padding:10px 23px}.controls-hint{margin-top:11px}}
</style>
</head>
<body>
<main class="game-shell" aria-label="Meadowbound platform game">
<canvas id="game" aria-label="A little fox hops across a sunny meadow collecting coins"></canvas>
<header class="topbar"><div class="brand"><div class="brand-mark">🌱</div><div><div class="brand-name">meadowbound</div><div class="brand-sub">a tiny sky adventure</div></div></div><div class="stats"><div class="pill"><span class="pill-icon">🪙</span><span id="coin-count">00</span></div><div class="pill"><span class="pill-icon">♡</span><span id="life-count">3</span></div></div></header>
<div class="progress-wrap"><div class="progress-label"><span>Meadow trail</span><span id="progress-label">0%</span></div><div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div></div>
<div class="bottom-hint" id="bottom-hint">← → move &nbsp;·&nbsp; space to jump</div>
<button class="sound-button" id="sound-button" aria-label="Enable sound">♪</button>
<div class="mobile-controls"><button id="left-button" aria-label="Move left">←</button><div class="right-group"><button id="right-button" aria-label="Move right">→</button><button class="jump" id="jump-button" aria-label="Jump">↑</button></div></div>
<div class="overlay" id="overlay"><section class="card"><div class="eyebrow" id="card-eyebrow">✦ &nbsp; a little platform adventure</div><h1 id="card-title">Find your<br><em>sunny side.</em></h1><p id="card-copy">Follow the grassy trail, scoop up golden coins, and see what’s waiting at the end of the meadow.</p><button class="play-button" id="play-button">Let’s hop! &nbsp; →</button><div class="controls-hint" id="controls-hint">Use <b>← →</b> or <b>A D</b> to run &nbsp;·&nbsp; <b>SPACE</b> to jump</div></section></div>
</main>
<script>
(() => {
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const shell=document.querySelector('.game-shell'),overlay=document.getElementById('overlay');
const coinUI=document.getElementById('coin-count'),lifeUI=document.getElementById('life-count');
const progressFill=document.getElementById('progress-fill'),progressLabel=document.getElementById('progress-label');
const WORLD_END=4760,GRAVITY=1750,PLAYER_W=30,PLAYER_H=39;
let w=0,h=0,dpr=1,scale=1,cam=0,last=0,mode='title',coins=0,lives=3,soundOn=false,audio;
let keys={left:false,right:false},jumpHeld=false,particles=[],floatTexts=[],shake=0;
const groundY=()=>h*.76;
const player={x:90,y:0,vx:0,vy:0,onGround:false,face:1,invuln:0,anim:0,checkpoint:90};
// Hand-shaped islands make a friendly, forgiving hop rhythm.
const platforms=[
 {x:0,y:.76,w:560},{x:620,y:.69,w:250},{x:944,y:.76,w:340},{x:1360,y:.68,w:260},
 {x:1700,y:.75,w:345},{x:2120,y:.67,w:260},{x:2465,y:.75,w:330},{x:2860,y:.68,w:260},
 {x:3202,y:.76,w:370},{x:3640,y:.68,w:265},{x:3985,y:.75,w:325},{x:4380,y:.68,w:380}
];
const coinsWorld=[];
[[155,0],[218,0],[365,0],[511,0],[690,0],[752,0],[816,0],[1030,0],[1120,0],[1200,0],[1435,0],[1510,0],[1580,0],[1790,0],[1870,0],[1980,0],[2200,0],[2285,0],[2370,0],[2540,0],[2635,0],[2740,0],[2940,0],[3025,0],[3110,0],[3290,0],[3400,0],[3500,0],[3720,0],[3800,0],[3900,0],[4070,0],[4170,0],[4270,0],[4475,0],[4560,0],[4640,0]].forEach(([x])=>coinsWorld.push({x,y:0,taken:false}));
function resize(){const r=shell.getBoundingClientRect();w=r.width;h=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);scale=Math.max(.65,Math.min(1.15,h/650));}
new ResizeObserver(resize).observe(shell);resize();
function groundAt(x){for(const p of platforms)if(x>=p.x&&x<=p.x+p.w)return p.y*h;return null}
function platformTop(p){return p.y*h}
function reset(){coins=0;lives=3;player.x=90;player.y=groundY()-PLAYER_H;player.vx=player.vy=0;player.onGround=true;player.invuln=0;player.checkpoint=90;cam=0;shake=0;particles=[];floatTexts=[];coinsWorld.forEach(c=>c.taken=false);updateHUD();}
function begin(){if(mode==='title'||mode==='dead'||mode==='won'){reset()}mode='playing';overlay.classList.add('hidden');last=performance.now();playSound('start');}
function updateHUD(){coinUI.textContent=String(coins).padStart(2,'0');lifeUI.textContent=lives;const progress=Math.min(100,Math.max(0,player.x/(WORLD_END-90)*100));progressFill.style.width=progress+'%';progressLabel.textContent=Math.floor(progress)+'%';}
function roundRect(c,x,y,ww,hh,r){c.beginPath();c.roundRect(x,y,ww,hh,r);}
function pathHill(x,y,ww,hh,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.moveTo(x-20,h+30);ctx.lineTo(x-20,y+hh*.55);ctx.bezierCurveTo(x+ww*.2,y-hh*.36,x+ww*.76,y-hh*.18,x+ww+20,y+hh*.38);ctx.lineTo(x+ww+20,h+30);ctx.closePath();ctx.fill()}
function drawCloud(x,y,s,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle='#fff9e9';ctx.beginPath();ctx.ellipse(x,y,s*1.12,s*.29,0,0,Math.PI*2);ctx.ellipse(x-s*.43,y-s*.08,s*.43,s*.34,0,0,Math.PI*2);ctx.ellipse(x-s*.08,y-s*.25,s*.51,s*.48,0,0,Math.PI*2);ctx.ellipse(x+s*.36,y-s*.12,s*.43,s*.35,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawBackground(time){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#83cfee');g.addColorStop(.58,'#b4e7e9');g.addColorStop(1,'#e8efc7');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
const sunX=w*.78-cam*.045,sunY=h*.22;ctx.fillStyle='#ffeab0';ctx.beginPath();ctx.arc(sunX,sunY,Math.min(w,h)*.075,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff3c9';ctx.beginPath();ctx.arc(sunX,sunY,Math.min(w,h)*.052,0,Math.PI*2);ctx.fill();
for(let i=0;i<7;i++){const x=((i*233-cam*.12+time*.009)%(w+360)+w+360)%(w+360)-140;drawCloud(x,h*(.12+(i%3)*.1),43+(i%3)*10,.73)}
const shift1=(cam*.18)%(w*1.5),shift2=(cam*.3)%(w*1.5);for(let i=-1;i<3;i++){pathHill(i*w*1.5-shift1,h*.49,w*.72,h*.45,'#a5d6b3');pathHill(i*w*1.5+w*.7-shift2,h*.61,w*.86,h*.34,'#7fc49c')}
// Tiny birds drift over the distant hills.
ctx.strokeStyle='#5e9d9e88';ctx.lineWidth=2;for(let i=0;i<4;i++){const bx=((i*170+time*.035)%(w+100))-50,by=h*(.34+(i%2)*.07);ctx.beginPath();ctx.arc(bx,by,7,Math.PI*1.08,Math.PI*1.85);ctx.arc(bx+11,by,7,Math.PI*1.15,Math.PI*1.92);ctx.stroke()}}
function drawPlatform(p){const x=p.x-cam,y=platformTop(p),ww=p.w;ctx.fillStyle='#a56751';ctx.beginPath();ctx.moveTo(x,y+7);ctx.lineTo(x+ww,y+7);ctx.lineTo(x+ww-7,y+35);ctx.quadraticCurveTo(x+ww*.65,y+45,x+ww*.43,y+37);ctx.quadraticCurveTo(x+ww*.17,y+49,x+7,y+35);ctx.closePath();ctx.fill();ctx.fillStyle='#d18c63';ctx.fillRect(x+4,y+11,ww-8,4);
ctx.fillStyle='#78bd62';ctx.beginPath();ctx.moveTo(x,y+8);ctx.quadraticCurveTo(x+ww*.18,y-5,x+ww*.35,y+4);ctx.quadraticCurveTo(x+ww*.53,y-8,x+ww*.72,y+4);ctx.quadraticCurveTo(x+ww*.88,y-4,x+ww,y+6);ctx.lineTo(x+ww,y+14);ctx.lineTo(x,y+14);ctx.closePath();ctx.fill();ctx.fillStyle='#9bd47a';ctx.fillRect(x+10,y+9,ww-20,2);
// Little flowers along the sod.
for(let i=0;i<Math.floor(ww/72);i++){const fx=x+28+i*72+((p.x+i*17)%19);if(fx>x+8&&fx<x+ww-8){ctx.fillStyle=i%2?'#fff5cf':'#f6a978';ctx.beginPath();ctx.arc(fx,y+3,2.4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff7e2';ctx.beginPath();ctx.arc(fx+3,y+1,1.5,0,Math.PI*2);ctx.fill()}}}
function drawCoin(c,time){if(c.taken)return;const x=c.x-cam,y=c.y,spin=Math.abs(Math.cos(time*.004+c.x))*.32+.68;ctx.save();ctx.translate(x,y);ctx.scale(spin,1);ctx.fillStyle='#e99c35';ctx.beginPath();ctx.ellipse(0,0,10,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffcf55';ctx.beginPath();ctx.ellipse(-1,-1,7,10,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff1a8';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,4,-1.2,1.6);ctx.stroke();ctx.restore()}
function drawFox(time){const sx=player.x-cam,sy=player.y;ctx.save();if(player.invuln>0&&Math.floor(time/90)%2===0)ctx.globalAlpha=.35;ctx.translate(sx+PLAYER_W/2,sy+PLAYER_H/2);ctx.scale(player.face,1);const bob=player.onGround?Math.sin(player.anim*13)*1.5:0;ctx.translate(0,bob);
// tail
ctx.fillStyle='#e9854d';ctx.beginPath();ctx.moveTo(-9,8);ctx.quadraticCurveTo(-24,4,-22,-9);ctx.quadraticCurveTo(-9,-7,-6,2);ctx.fill();ctx.fillStyle='#fff1dc';ctx.beginPath();ctx.moveTo(-22,-7);ctx.quadraticCurveTo(-17,-7,-13,-4);ctx.quadraticCurveTo(-17,-1,-21,-1);ctx.closePath();ctx.fill();
// ears
ctx.fillStyle='#d97545';ctx.beginPath();ctx.moveTo(-10,-8);ctx.lineTo(-13,-21);ctx.quadraticCurveTo(-5,-19,-3,-9);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(4,-9);ctx.lineTo(9,-22);ctx.quadraticCurveTo(15,-15,12,-6);ctx.closePath();ctx.fill();ctx.fillStyle='#f8b18a';ctx.beginPath();ctx.moveTo(-10,-11);ctx.lineTo(-11,-17);ctx.lineTo(-7,-11);ctx.fill();ctx.beginPath();ctx.moveTo(7,-11);ctx.lineTo(9,-17);ctx.lineTo(10,-10);ctx.fill();
// body and face
ctx.fillStyle='#e9854d';roundRect(ctx,-12,-12,25,26,10);ctx.fill();ctx.fillStyle='#fff0d9';ctx.beginPath();ctx.ellipse(4,4,8,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff5e7';ctx.beginPath();ctx.ellipse(7,-5,9,7,.2,0,Math.PI*2);ctx.fill();ctx.fillStyle='#304d55';ctx.beginPath();ctx.arc(8,-7,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(14,-2,1.7,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#fff0d9';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-5,12);ctx.lineTo(-7,16);ctx.moveTo(7,12);ctx.lineTo(8,16);ctx.stroke();ctx.restore()}
function coinY(c){let base=h*.6;for(const p of platforms)if(c.x>=p.x&&c.x<=p.x+p.w){base=platformTop(p)-35;break}return base+Math.sin(c.x*.04)*2}
function drawGoal(){const x=WORLD_END-cam,y=groundY()-95;if(x<-80||x>w+90)return;ctx.strokeStyle='#fff4d1';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x,y+94);ctx.lineTo(x,y+35);ctx.arc(x+37,y+35,37,Math.PI,0);ctx.lineTo(x+74,y+94);ctx.stroke();ctx.fillStyle='#ed9b4e';ctx.beginPath();ctx.arc(x+37,y+35,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff1bc';ctx.beginPath();ctx.arc(x+37,y+35,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff7e2';ctx.font='700 11px DM Sans';ctx.textAlign='center';ctx.fillText('HOME',x+37,y+112)}
function drawDecor(){for(let i=0;i<30;i++){const wx=140+i*161;if(wx<cam-40||wx>cam+w+40)continue;const gx=groundAt(wx);if(gx===null)continue;const x=wx-cam;ctx.fillStyle=i%3?'#5c9e69':'#78ad72';ctx.beginPath();ctx.ellipse(x,gx-7,13,9,0,Math.PI,Math.PI*2);ctx.ellipse(x-9,gx-3,8,7,0,Math.PI,Math.PI*2);ctx.ellipse(x+9,gx-3,8,7,0,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#769b61';ctx.fillRect(x-2,gx-1,4,8);}}
function draw(time){drawBackground(time);for(const p of platforms){const x=p.x-cam;if(x+p.w>-30&&x<w+30)drawPlatform(p)}drawDecor();for(const c of coinsWorld){c.y=coinY(c);if(c.x-cam>-30&&c.x-cam<w+30)drawCoin(c,time)}drawGoal();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x-cam,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;for(const f of floatTexts){ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle='#fff6cd';ctx.font='700 17px Fredoka';ctx.textAlign='center';ctx.fillText(f.text,f.x-cam,f.y)}ctx.globalAlpha=1;if(mode!=='title'||player.x>90)drawFox(time)}
function burst(x,y,color,n=8){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*130;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-35,life:.45+Math.random()*.35,max:.8,r:2+Math.random()*3,color})}}
function playSound(kind){if(!soundOn)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();const osc=audio.createOscillator(),gain=audio.createGain();osc.connect(gain);gain.connect(audio.destination);osc.type='sine';const now=audio.currentTime;const notes=kind==='coin'?[700,980]:kind==='jump'?[330,450]:kind==='hurt'?[180,100]:[440,660];osc.frequency.setValueAtTime(notes[0],now);if(notes[1])osc.frequency.exponentialRampToValueAtTime(notes[1],now+.09);gain.gain.setValueAtTime(.055,now);gain.gain.exponentialRampToValueAtTime(.001,now+.13);osc.start(now);osc.stop(now+.14)}catch(_){}}
function damage(){if(player.invuln>0||mode!=='playing')return;lives--;lifeUI.textContent=lives;player.invuln=1.6;player.vy=-470;player.vx=-player.face*180;shake=9;playSound('hurt');burst(player.x+15,player.y+20,'#fff0d9',12);if(lives<=0){setTimeout(()=>endGame(false),500)}else if(player.y>h+80){player.x=player.checkpoint;player.y=(groundAt(player.x)||groundY())-PLAYER_H;player.vx=player.vy=0}}
function endGame(won){mode=won?'won':'dead';overlay.classList.remove('hidden');document.getElementById('card-eyebrow').textContent=won?'✦ &nbsp; meadow explored':'☁ &nbsp; take a little breather';document.getElementById('card-title').innerHTML=won?'You found your<br><em>sunny side!</em>':'One more<br><em>little hop?</em>';document.getElementById('card-copy').textContent=won?`A lovely little journey! You gathered ${coins} golden ${coins===1?'coin':'coins'} along the way.`:`You gathered ${coins} golden ${coins===1?'coin':'coins'}. The meadow will be right here when you’re ready.`;document.getElementById('play-button').textContent=won?'Play again  →':'Try again  →';document.getElementById('controls-hint').innerHTML='A sunny meadow, a fresh start, and <b>all the coins</b>.';playSound(won?'start':'hurt')}
let jumpBuffer=0,coyote=0;
function step(dt,time){if(mode!=='playing')return;dt=Math.min(dt,.033);player.anim+=dt;player.invuln=Math.max(0,player.invuln-dt);if(shake>0)shake=Math.max(0,shake-dt*28);
if(keys.left){player.vx-=1500*dt;player.face=-1}if(keys.right){player.vx+=1500*dt;player.face=1}if(!keys.left&&!keys.right)player.vx*=Math.pow(.001,dt);player.vx=Math.max(-260,Math.min(260,player.vx));if(jumpBuffer>0){jumpBuffer-=dt;if(player.onGround||coyote>0){player.vy=-650;player.onGround=false;coyote=0;jumpBuffer=0;playSound('jump');burst(player.x+15,player.y+PLAYER_H,'#f8f2d3',5)}}
const oldBottom=player.y+PLAYER_H;player.vy+=GRAVITY*dt;if(jumpHeld&&player.vy<0)player.vy-=480*dt;player.x=Math.max(0,Math.min(WORLD_END-15,player.x+player.vx*dt));player.y+=player.vy*dt;player.onGround=false;
if(player.vy>=0){for(const p of platforms){const top=platformTop(p);if(player.x+PLAYER_W>p.x+5&&player.x<p.x+p.w-5&&oldBottom<=top+7&&player.y+PLAYER_H>=top){player.y=top-PLAYER_H;player.vy=0;player.onGround=true;coyote=.105;player.checkpoint=Math.max(player.checkpoint,Math.min(p.x+p.w-50,WORLD_END-130));break}}}if(player.onGround)coyote=.105;else coyote=Math.max(0,coyote-dt);if(player.y>h+100)damage();if(player.invuln>0&&player.y>h+50&&lives>0){player.x=player.checkpoint;const floor=groundAt(player.x);player.y=(floor??groundY())-PLAYER_H;player.vx=player.vy=0}
for(const c of coinsWorld){if(c.taken)continue;const cy=coinY(c);if(Math.abs((player.x+PLAYER_W/2)-c.x)<23&&Math.abs((player.y+PLAYER_H*.45)-cy)<28){c.taken=true;coins++;coinUI.textContent=String(coins).padStart(2,'0');playSound('coin');burst(c.x,cy,'#ffcf55',9);floatTexts.push({x:c.x,y:cy-8,text:'+1',life:.8})}}
for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=350*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);for(const f of floatTexts){f.y-=26*dt;f.life-=dt}floatTexts=floatTexts.filter(f=>f.life>0);
const target=Math.max(0,Math.min(WORLD_END-w,player.x-w*.36));cam+=(target-cam)*Math.min(1,dt*4.8);updateHUD();if(player.x>WORLD_END-40)endGame(true)}
function frame(t){const dt=last?Math.min((t-last)/1000,.033):0;last=t;step(dt,t);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);draw(t);ctx.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function startJump(){jumpBuffer=.14;jumpHeld=true}function stopJump(){jumpHeld=false}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','A','d','D','w','W'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=true;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=true;if((e.key===' '||e.key==='ArrowUp'||e.key==='w'||e.key==='W')&&!e.repeat)startJump();if(e.key==='Enter'&&mode!=='playing')begin();if(e.key==='Escape'&&mode==='playing'){mode='paused';overlay.classList.remove('hidden');document.getElementById('card-eyebrow').textContent='Ⅱ &nbsp; little pause';document.getElementById('card-title').innerHTML='Catch your<br><em>breath.</em>';document.getElementById('card-copy').textContent='The meadow will wait. Ready when you are.';document.getElementById('play-button').textContent='Keep hopping  →';document.getElementById('controls-hint').innerHTML='Press <b>ESC</b> to pause or continue.'}else if(e.key==='Escape'&&mode==='paused'){mode='playing';overlay.classList.add('hidden');last=performance.now()}});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')keys.left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')keys.right=false;if([' ','ArrowUp','w','W'].includes(e.key))stopJump()});
function bindHold(id,key){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>keys[key]=false)}bindHold('left-button','left');bindHold('right-button','right');const jb=document.getElementById('jump-button');jb.addEventListener('pointerdown',e=>{e.preventDefault();startJump();jb.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>jb.addEventListener(ev,stopJump));
document.getElementById('play-button').addEventListener('click',()=>{if(mode==='paused'){mode='playing';overlay.classList.add('hidden');last=performance.now()}else begin()});document.getElementById('sound-button').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♫':'♪';e.currentTarget.setAttribute('aria-label',soundOn?'Mute sound':'Enable sound');if(soundOn)playSound('start')});
})();
